services:
  redis:
    image: redis:alpine
    container_name: am_education_redis
    networks:
      - am_education
    volumes:
      - redis_data:/data

  mysql:
    image: mysql:8.4
    container_name: am_education_mysql
    ports:
      - "3306:3307"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: am_education
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - am_education

  am_education_be:
    image: luongtruong20201/am_education_api:develop
    container_name: am_education_be
    restart: always
    depends_on:
      - mysql
      - redis
    env_file:
      - ./am_education_be/.env.example
    ports:
      - "8080:8080"
    volumes:
      - ./public.pem:/app/public.pem
      - ./private.pem:/app/private.pem
    networks:
      - am_education

  am_education_fe:
    image: nghia130302/am_education_fe:develop
    container_name: am_education_fe
    restart: always
    depends_on:
      - am_education_be
    ports:
      - "3000:5173"
    networks:
      - am_education
    env_file:
      - ./am_education_fe/.env.example

  nginx:
    image: nginx:alpine
    container_name: am_education_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - am_education

volumes:
  mysql_data:
  redis_data:
  

networks:
  am_education:
    driver: bridge