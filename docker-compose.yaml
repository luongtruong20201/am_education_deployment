services:
  redis:
    image: redis:alpine
    container_name: am_education_redis
    restart: unless-stopped
    networks:
      - am_education
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  mysql:
    image: mysql:8.4
    container_name: am_education_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: am_education
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - am_education
    expose:
      - "3306"

  am_education_be:
    image: luongtruong20201/am_education_api:develop
    container_name: am_education_be
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    env_file:
      - ./am_education_be/.env.example
    volumes:
      - ./public.pem:/app/public.pem:ro
      - ./private.pem:/app/private.pem:ro
    expose:
      - "8080"
    networks:
      - am_education

  am_education_fe:
    image: nghia130302/am_education_fe:develop
    container_name: am_education_fe
    restart: unless-stopped
    depends_on:
      - am_education_be
    expose:
      - "80"
    networks:
      - am_education

  nginx:
    image: nginx:alpine
    container_name: am_education_nginx
    restart: unless-stopped
    depends_on:
      - am_education_fe
      - am_education_be
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - am_education

volumes:
  mysql_data:
  redis_data:

networks:
  am_education:
    driver: bridge