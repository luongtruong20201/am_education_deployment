services:
  redis:
    image: redis:alpine
    container_name: am_education_redis
    restart: unless-stopped
    networks:
      - am_education
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  mysql:
    image: mysql:8.4
    container_name: am_education_mysql
    restart: unless-stopped
    command: --max_connections=500
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: am_education
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - am_education
    expose:
      - "3306"

  minio:
    image: minio/minio:latest
    container_name: am_education_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - am_education

  am_education_be:
    build:
      context: ../am_education_be
      dockerfile: Dockerfile
    image: luongtruong20201/am_education_api:develop
    container_name: am_education_be
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    env_file:
      - ./am_education_be/.env.example
    environment:
      - USE_MINIO=true
      - MINIO_ENDPOINT=am_education_minio:9000
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-mocktest.amedu.vn}
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - MINIO_BUCKET=ielts-audio
      - MINIO_USE_SSL=${MINIO_USE_SSL:-true}
      - MINIO_PRESIGN_EXPIRY_SECONDS=3600
    expose:
      - "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./public.pem:/app/public.pem:ro
      - ./private.pem:/app/private.pem:ro
    networks:
      - am_education

  am_education_fe:
    build:
      context: ../am_education_fe
      dockerfile: Dockerfile
    image: nghia130302/am_education_fe:develop
    container_name: am_education_fe
    restart: unless-stopped
    depends_on:
      - am_education_be
    expose:
      - "80"
    ports:
      - "3000:80"
    networks:
      - am_education

  nginx:
    image: nginx:alpine
    container_name: am_education_nginx
    restart: unless-stopped
    depends_on:
      - am_education_fe
      - am_education_be
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - am_education

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  am_education:
    driver: bridge