version: "3.7"

services:
  redis:
    image: redis:alpine
    container_name: redis
  
  mysql:
    image: mysql:8.4
    container_name: mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bookmark_network
    environment:
      - MYSQL_ROOT_PASSWORD=mysql
      - MYSQL_DATABASE=am_education
      - MYSQL_USER=mysql
      - MYSQL_PASSWORD=mysql

  am_education_be:
    image: luongtruong20201/am_education_api:develop
    restart: always
    container_name: am_education_be
    depends_on:
      - redis
      - postgres
    env_file:
      - ./am_education_be/.env
    volumes:
      - ./public_key.pem:/app/public_key.pem
      - ./private_key.pem:/app/private_key.pem
  
  nginx:
    image: nginx:alpine
    restart: always
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"