services:
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - am_education

  mysql:
    image: mysql:8.4
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: am_education
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - am_education

  am_education_be:
    image: luongtruong20201/am_education_api:develop
    container_name: am_education_be
    restart: always
    depends_on:
      - mysql
      - redis
    env_file:
      - ./am_education/.env.example
    volumes:
      - ./public.pem:/app/public.pem
      - ./private.pem:/app/private.pem
    networks:
      - am_education

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - am_education

volumes:
  mysql_data:

networks:
  am_education:
    driver: bridge