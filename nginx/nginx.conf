upstream am_education_be {
    server am_education_be:8080;
}

upstream am_education_fe {
    server am_education_fe:80;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://am_education_fe/;
    }

    location /api/am_education_be/ {
        proxy_pass http://am_education_be/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}