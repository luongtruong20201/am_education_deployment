server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=5s;

    client_max_body_size 50M;

    location / {
        set $upstream_fe am_education_fe:80;
        proxy_pass http://$upstream_fe;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct MinIO proxy for secure media and audio/image streaming
    location /ielts-audio/ {
        set $upstream_minio am_education_minio:9000;
        proxy_pass http://$upstream_minio;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/media/serve/ {
        set $upstream_minio am_education_minio:9000;
        rewrite ^/api/media/serve/(.*)$ /ielts-audio/$1 break;
        proxy_pass http://$upstream_minio;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/am_education_be/api/media/serve/ {
        set $upstream_minio am_education_minio:9000;
        rewrite ^/api/am_education_be/api/media/serve/(.*)$ /ielts-audio/$1 break;
        proxy_pass http://$upstream_minio;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/am_education_be {
        return 307 /api/am_education_be/;
    }

    location ^~ /api/am_education_be/ {
        proxy_pass http://am_education_be:8080/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}